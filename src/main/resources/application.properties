# AI-assisted.
# Hosts, credentials, and the listen port come from the deployment environment.
# Cloud Run injects PORT and reaches the process on every interface.
spring.application.name=cvnstack
server.address=0.0.0.0
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cvnstack}
spring.datasource.username=${DATABASE_USERNAME:cvnstack}
spring.datasource.password=${DATABASE_PASSWORD:cvnstack}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=1500000
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
cvnstack.startup.verify-stores=${VERIFY_STORES:false}
