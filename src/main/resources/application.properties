# AI-assisted.
# Datasource hosts and credentials are supplied by the deployment environment.
spring.application.name=cvnstack
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cvnstack}
spring.datasource.username=${DATABASE_USERNAME:cvnstack}
spring.datasource.password=${DATABASE_PASSWORD:cvnstack}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
