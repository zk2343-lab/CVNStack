# AI-assisted.
# Local PostgreSQL, Redis, and the service image. Same keys Cloud Run will set.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cvnstack
      POSTGRES_USER: cvnstack
      POSTGRES_PASSWORD: cvnstack
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvnstack -d cvnstack"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/cvnstack
      DATABASE_USERNAME: cvnstack
      DATABASE_PASSWORD: cvnstack
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
